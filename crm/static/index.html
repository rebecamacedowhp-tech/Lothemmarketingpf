<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM com IA</title>
<link rel="stylesheet" href="/static/estilo.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
#busca{max-width:240px}
.quadro{display:flex;gap:12px;padding:16px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 60px)}
.coluna{flex:0 0 272px;background:var(--card);border:1px solid var(--borda);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 92px)}
.coluna h2{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;gap:6px}
.bolinha{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.cards{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.cards.sobre{background:color-mix(in srgb,var(--prim) 10%,transparent)}
.lead{background:var(--bg);border:1px solid var(--borda);border-radius:10px;padding:9px 10px;cursor:pointer}
.lead:hover{border-color:var(--prim)}
.lead b{display:block;margin-bottom:2px}
.lead .tel{color:var(--sub);font-size:12px}
.lead .dor{font-size:12px;margin:6px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lead .rodape{display:flex;gap:6px;flex-wrap:wrap}
.quente{background:#fee2e2;color:#b91c1c}.morno{background:#fef3c7;color:#92400e}.frio{background:#e0e7ff;color:#3730a3}
.ia-on{background:#d1fae5;color:#065f46}.ia-off{background:#ede9fe;color:#5b21b6}
#painel{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--card);border-left:1px solid var(--borda);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;z-index:10}
#painel.aberto{transform:none}
#painel .topo{padding:14px 16px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;gap:8px}
#painel .corpo{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;flex:1}
.preencher{width:100%;padding:12px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.resumo{background:color-mix(in srgb,var(--prim) 8%,var(--card));border:1px solid color-mix(in srgb,var(--prim) 35%,transparent);border-radius:10px;padding:12px}
.resumo h3,.bloco h3{margin:0 0 6px;font-size:13px}
.resumo p{margin:0;white-space:pre-wrap}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.grade .inteira{grid-column:1/-1}
.chat{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;padding:8px;background:var(--bg);border-radius:10px}
.msg{max-width:85%;padding:7px 10px;border-radius:10px;white-space:pre-wrap;font-size:13px}
.msg small{display:block;color:var(--sub);font-size:10px;margin-bottom:2px}
.msg.cliente{background:var(--card);align-self:flex-start;border:1px solid var(--borda)}
.msg.ia{background:#dcfce7;color:#14532d;align-self:flex-end}
.msg.vendedor{background:#ede9fe;color:#3b0764;align-self:flex-end}
.enviar{display:flex;gap:8px}
.hist{font-size:12px;color:var(--sub);margin:0;padding-left:16px}
#simulador{display:none;position:fixed;bottom:16px;left:16px;width:min(340px,calc(100% - 32px));background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:9;gap:8px;flex-direction:column}
#simulador.aberto{display:flex}
@media (max-width:640px){.grade{grid-template-columns:1fr}#busca{max-width:none}}
</style>
</head>
<body>
<header class="topo-app">
  <h1 id="titulo">CRM</h1>
  <input id="busca" placeholder="Buscar nome, telefone, necessidade…">
  <span class="status" id="status"></span>
  <span style="flex:1"></span>
  <nav id="nav">
    <a href="/" class="ativo">Leads</a>
  </nav>
  <button class="sec" onclick="document.getElementById('simulador').classList.toggle('aberto')">Simular conversa</button>
  <button class="sec" id="sair">Sair</button>
</header>

<main class="quadro" id="quadro"></main>

<aside id="painel">
  <div class="topo">
    <div><b id="p-nome"></b><div class="status" id="p-tel"></div></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="sec" id="p-ia" title="Liga/desliga a SDR IA neste lead" hidden></button>
      <button class="sec" onclick="fechar()">✕</button>
    </div>
  </div>
  <div class="corpo">
    <button class="preencher" id="p-preencher">✨ Preencher CRM com IA</button>
    <div class="resumo">
      <h3>📋 Resumo para o vendedor</h3>
      <p id="p-resumo"></p>
      <p style="margin-top:8px"><b>Próximo passo:</b> <span id="p-proximo"></span></p>
    </div>
    <div class="bloco">
      <h3>Ficha do cliente</h3>
      <div class="grade" id="p-campos"></div>
      <div style="margin-top:8px"><button id="p-salvar">Salvar ficha</button></div>
    </div>
    <div class="bloco">
      <h3>Conversa no WhatsApp</h3>
      <div class="chat" id="p-chat"></div>
      <div class="enviar" style="margin-top:8px">
        <input id="p-texto" placeholder="Responder pelo WhatsApp">
        <button id="p-enviar">Enviar</button>
      </div>
    </div>
    <div class="bloco">
      <h3>Documentos</h3>
      <ul class="hist" id="p-anexos" style="list-style:none;padding:0"></ul>
    </div>
    <div class="bloco">
      <h3>Histórico</h3>
      <ul class="hist" id="p-hist"></ul>
    </div>
  </div>
</aside>

<div id="simulador">
  <b>Simular conversa (sem WhatsApp)</b>
  <span class="status">Cria mensagens de teste num lead, como se viessem do WhatsApp.</span>
  <input id="s-tel" placeholder="Telefone (ex.: 5511999990000)" value="5511999990000">
  <input id="s-nome" placeholder="Nome no WhatsApp" value="Cliente Teste">
  <select id="s-autor"><option value="cliente">Quem fala: cliente</option><option value="vendedor">Quem fala: vendedor</option></select>
  <textarea id="s-texto" rows="3" placeholder="Mensagem"></textarea>
  <button id="s-enviar">Enviar mensagem de teste</button>
</div>
<div class="toast" id="toast"></div>

<script>
let cfg = null, leads = [], aberto = null, arrastando = null, dadosAberto = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora = iso => iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
function aviso(t) { const el = $("toast"); el.textContent = t; el.classList.add("vis"); setTimeout(() => el.classList.remove("vis"), 3000); }

async function api(url, opts = {}) {
  const r = await fetch(url, {headers: {"Content-Type": "application/json"}, ...opts});
  if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function carregar() {
  try {
    leads = await api("/api/leads?busca=" + encodeURIComponent($("busca").value));
    desenhar();
    const modo = cfg.sdr_ativa ? `SDR ${cfg.nome_sdr} ligada` : "IA preenche o CRM";
    $("status").textContent = (cfg.whatsapp_conectado ? "WhatsApp conectado" : "WhatsApp não conectado") + " · " + modo + " · " + leads.length + " leads";
  } catch (e) { if (e.message !== "login") $("status").textContent = "Erro: " + e.message; }
}

function desenhar() {
  const q = $("quadro");
  q.innerHTML = "";
  const ids = new Set(cfg.listas.map(l => l.id));
  for (const [i, l] of cfg.listas.entries()) {
    // leads de uma etapa que foi removida aparecem na primeira coluna
    const doLista = leads.filter(x => x.lista === l.id || (i === 0 && !ids.has(x.lista)));
    const col = document.createElement("section");
    col.className = "coluna";
    col.innerHTML = `<h2><span><span class="bolinha" style="background:${esc(l.cor)}"></span>${esc(l.nome)}</span><span class="pill">${doLista.length}</span></h2><div class="cards"></div>`;
    const cards = col.querySelector(".cards");
    cards.ondragover = e => { e.preventDefault(); cards.classList.add("sobre"); };
    cards.ondragleave = () => cards.classList.remove("sobre");
    cards.ondrop = async e => {
      e.preventDefault(); cards.classList.remove("sobre");
      if (arrastando) { await api(`/api/leads/${arrastando}`, {method:"PATCH", body: JSON.stringify({lista: l.id})}); carregar(); }
    };
    for (const x of doLista) {
      const c = document.createElement("div");
      c.className = "lead"; c.draggable = true;
      c.ondragstart = () => arrastando = x.id;
      c.onclick = () => abrir(x.id);
      const primeiro = cfg.campos[0] && x.ficha[cfg.campos[0].id];
      c.innerHTML = `<b>${esc(x.nome || x.nome_whatsapp || "Sem nome")}</b>
        <span class="tel">${esc(x.telefone)}${primeiro ? " · " + esc(primeiro) : ""}</span>
        <div class="dor">${x.dor ? "🎯 " + esc(x.dor) : "<i style='color:var(--sub)'>Necessidade ainda não identificada</i>"}</div>
        <div class="rodape">
          ${x.temperatura ? `<span class="pill ${x.temperatura}">${x.temperatura}</span>` : ""}
          ${x.score ? `<span class="pill">score ${x.score}</span>` : ""}
          ${cfg.sdr_ativa ? `<span class="pill ${x.ia_ativa ? "ia-on" : "ia-off"}">${x.ia_ativa ? "IA atendendo" : "Humano"}</span>` : ""}
          ${x.vendedor ? `<span class="pill">👤 ${esc(x.vendedor)}</span>` : ""}
        </div>`;
      cards.appendChild(c);
    }
    q.appendChild(col);
  }
}

async function abrir(id) {
  aberto = id;
  const d = dadosAberto = await api(`/api/leads/${id}`);
  $("p-nome").textContent = d.nome || d.nome_whatsapp || "Sem nome";
  $("p-tel").textContent = "+" + d.telefone + (d.temperatura ? " · " + d.temperatura : "") + (d.score ? " · score " + d.score : "");
  $("p-resumo").textContent = d.resumo || "Ainda sem resumo. Clique em “Preencher CRM com IA” para a IA ler a conversa.";
  $("p-proximo").textContent = d.proximo_passo || "—";
  $("p-ia").hidden = !cfg.sdr_ativa;
  $("p-ia").textContent = d.ia_ativa ? "🤖 SDR ligada" : "👤 SDR pausada";
  $("p-ia").onclick = async () => { await api(`/api/leads/${id}`, {method:"PATCH", body: JSON.stringify({ia_ativa: !d.ia_ativa})}); abrir(id); carregar(); };
  const html = [
    `<label>Nome<input data-k="nome" value="${esc(d.nome)}"></label>`,
    `<label>Telefone WhatsApp<input value="${esc(d.telefone)}" readonly></label>`,
    `<label class="inteira">Necessidade / dor do cliente<textarea data-k="dor" rows="3">${esc(d.dor)}</textarea></label>`,
  ];
  for (const c of cfg.campos) html.push(`<label title="${esc(c.instrucao)}">${esc(c.rotulo)}<input data-f="${esc(c.id)}" value="${esc(d.ficha[c.id])}"></label>`);
  html.push(`<label>Vendedor responsável<input data-k="vendedor" value="${esc(d.vendedor)}"></label>`);
  html.push(`<label>Etapa<select data-k="lista">${cfg.listas.map(l => `<option value="${esc(l.id)}" ${l.id === d.lista ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select></label>`);
  $("p-campos").innerHTML = html.join("");
  const rot = {cliente: "Cliente", ia: cfg.nome_sdr + " (IA)", vendedor: "Vendedor"};
  $("p-chat").innerHTML = d.mensagens.map(m => `<div class="msg ${m.autor}"><small>${rot[m.autor] || m.autor} · ${hora(m.criado_em)}</small>${esc(m.texto)}</div>`).join("") || "<span class='status'>Sem mensagens</span>";
  $("p-chat").scrollTop = 1e9;
  $("p-anexos").innerHTML = d.anexos.map(a => `<li><a href="/api/anexos/${a.id}" target="_blank">📎 ${esc(a.nome_arquivo)}</a> <span class="status">${hora(a.criado_em)}</span></li>`).join("") || "<li class='status'>Nenhum arquivo recebido ainda</li>";
  $("p-hist").innerHTML = d.historico.map(h => `<li>${hora(h.criado_em)} — ${esc(h.descricao)}</li>`).join("");
  $("painel").classList.add("aberto");
}
function fechar() { aberto = null; $("painel").classList.remove("aberto"); }

$("p-preencher").onclick = async () => {
  const b = $("p-preencher"); b.disabled = true; b.textContent = "✨ Lendo a conversa…";
  try { await api(`/api/leads/${aberto}/preencher`, {method: "POST"}); aviso("Ficha e resumo preenchidos pela IA"); }
  catch (e) { if (e.message !== "login") aviso(e.message); }
  b.disabled = false; b.textContent = "✨ Preencher CRM com IA";
  abrir(aberto); carregar();
};
$("p-salvar").onclick = async () => {
  const dados = {ficha: {}};
  $("p-campos").querySelectorAll("[data-k]").forEach(el => { dados[el.dataset.k] = el.value; });
  $("p-campos").querySelectorAll("[data-f]").forEach(el => { dados.ficha[el.dataset.f] = el.value; });
  await api(`/api/leads/${aberto}`, {method:"PATCH", body: JSON.stringify(dados)});
  aviso("Ficha salva"); abrir(aberto); carregar();
};
$("p-enviar").onclick = async () => {
  const texto = $("p-texto").value.trim(); if (!texto) return;
  try { await api(`/api/leads/${aberto}/mensagens`, {method:"POST", body: JSON.stringify({texto})}); $("p-texto").value = ""; }
  catch (e) { if (e.message !== "login") aviso("Não enviou: " + e.message); }
  abrir(aberto); carregar();
};
$("p-texto").onkeydown = e => { if (e.key === "Enter") $("p-enviar").click(); };
$("s-enviar").onclick = async () => {
  const b = $("s-enviar"); b.disabled = true; b.textContent = "Enviando…";
  try {
    const r = await api("/api/simular", {method:"POST", body: JSON.stringify({telefone: $("s-tel").value, nome_whatsapp: $("s-nome").value, texto: $("s-texto").value, autor: $("s-autor").value})});
    $("s-texto").value = ""; await carregar(); abrir(r.id);
  } catch (e) { if (e.message !== "login") aviso(e.message); }
  b.disabled = false; b.textContent = "Enviar mensagem de teste";
};
$("sair").onclick = async () => { await fetch("/api/logout", {method: "POST"}); location.href = "/login"; };
let t; $("busca").oninput = () => { clearTimeout(t); t = setTimeout(carregar, 300); };

(async () => {
  cfg = await api("/api/config");
  $("titulo").textContent = cfg.empresa;
  document.title = "CRM · " + cfg.empresa;
  if (cfg.papel === "dono" || cfg.papel === "admin") $("nav").insertAdjacentHTML("beforeend", `<a href="/configuracoes">Configurações</a>`);
  if (cfg.papel === "admin") $("nav").insertAdjacentHTML("beforeend", `<a href="/admin">Administração</a>`);
  await carregar();
  setInterval(() => { carregar(); const f = document.activeElement.tagName; if (aberto && !["INPUT","TEXTAREA","SELECT"].includes(f)) abrir(aberto); }, 6000);
})();
</script>
</body>
</html>
