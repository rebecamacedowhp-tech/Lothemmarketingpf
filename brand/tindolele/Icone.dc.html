<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito Sans', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #1B57B0; } a:hover { color: #123A7A; }
  </style>
</helmet>

<div style="width: 900px; height: 720px; box-sizing: border-box; background: #FBF7F0; padding: 56px; display: flex; flex-direction: column; gap: 34px;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.28em; color: #F58220; text-transform: uppercase;">Símbolo</div>
    <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 34px; font-weight: 700; color: #123A7A;">Ícone e avatar</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px;">

    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center;">
      <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 28px; background: #FFFFFF; box-shadow: 0 18px 40px -24px rgba(18,58,122,0.45); display: flex; align-items: center; justify-content: center;">
        <div style="width: 62%;">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <g stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round">
              <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#1B57B0"></path>
              <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
              <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path>
              <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
              <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
              <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path>
            </g>
            <circle cx="50" cy="50" r="13.5" fill="#FFFFFF"></circle>
            <circle cx="50" cy="50" r="7" fill="#00A3AD"></circle>
          </svg>
        </div>
      </div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Bola Tindolelê</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center;">
      <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 28px; background: #123A7A; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="width: 118px;">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <g stroke="#123A7A" stroke-width="3.5" stroke-linejoin="round">
                <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#4A8BE8"></path>
                <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
                <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path>
                <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
                <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
                <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#9B6BC4"></path>
              </g>
              <circle cx="50" cy="50" r="13.5" fill="#FFFFFF"></circle>
              <circle cx="50" cy="50" r="7" fill="#00A3AD"></circle>
            </svg>
          </div>
          <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 30px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.02em;">Tindolelê</div>
        </div>
      </div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Avatar / perfil</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center;">
      <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 28px; background: #FFFFFF; border: 2px dashed rgba(18,58,122,0.25); display: flex; align-items: center; justify-content: center;">
        <div style="width: 58%;">
          <svg viewBox="0 0 120 120" width="100%" height="100%">
            <circle cx="60" cy="60" r="52" fill="none" stroke="#123A7A" stroke-width="7"></circle>
            <g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
              <path d="M60 60 L60 24 A36 36 0 0 1 91.18 42 Z" fill="#1B57B0"></path>
              <path d="M60 60 L91.18 42 A36 36 0 0 1 91.18 78 Z" fill="#3CB44A"></path>
              <path d="M60 60 L91.18 78 A36 36 0 0 1 60 96 Z" fill="#FFC220"></path>
              <path d="M60 60 L60 96 A36 36 0 0 1 28.82 78 Z" fill="#F58220"></path>
              <path d="M60 60 L28.82 78 A36 36 0 0 1 28.82 42 Z" fill="#E8402A"></path>
              <path d="M60 60 L28.82 42 A36 36 0 0 1 60 24 Z" fill="#7C4DA0"></path>
            </g>
            <circle cx="60" cy="60" r="10" fill="#FFFFFF"></circle>
          </svg>
        </div>
      </div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Selo / carimbo</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 34px; padding: 24px 30px; background: #FFFFFF; border-radius: 22px;">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.2em; color: #123A7A; text-transform: uppercase;">Redução</div>
    <div style="display: flex; align-items: flex-end; gap: 26px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <svg viewBox="0 0 100 100" width="72" height="72"><g stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"><path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#1B57B0"></path><path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path><path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path><path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path><path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path><path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path></g><circle cx="50" cy="50" r="13.5" fill="#FFFFFF"></circle><circle cx="50" cy="50" r="7" fill="#00A3AD"></circle></svg>
        <span style="font-size: 11px; font-weight: 700; color: rgba(18,58,122,0.6);">72 px</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <svg viewBox="0 0 100 100" width="48" height="48"><g stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#1B57B0"></path><path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path><path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path><path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path><path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path><path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path></g><circle cx="50" cy="50" r="15" fill="#FFFFFF"></circle></svg>
        <span style="font-size: 11px; font-weight: 700; color: rgba(18,58,122,0.6);">48 px</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <svg viewBox="0 0 100 100" width="28" height="28"><g stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"><path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#1B57B0"></path><path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path><path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path><path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path><path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path><path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path></g><circle cx="50" cy="50" r="17" fill="#FFFFFF"></circle></svg>
        <span style="font-size: 11px; font-weight: 700; color: rgba(18,58,122,0.6);">28 px</span>
      </div>
    </div>
    <div style="font-size: 14px; font-weight: 600; color: rgba(18,58,122,0.7); line-height: 1.5; max-width: 300px;">Abaixo de 28 px use o símbolo sem o miolo turquesa — o contraste some.</div>
  </div>

</div>
</x-dc>
</body>
</html>
