<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito Sans', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #1B57B0; } a:hover { color: #123A7A; }
  </style>
</helmet>

<div style="width: 1440px; height: 940px; box-sizing: border-box; background: #FBF7F0; padding: 52px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.28em; color: #F58220; text-transform: uppercase;">Aplicações</div>
    <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 34px; font-weight: 700; color: #123A7A;">Fachada, uniforme, crachá e social</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; flex-grow: 1;">

    <div style="grid-column: span 7; display: flex; flex-direction: column; gap: 12px;">
      <div style="flex-grow: 1; border-radius: 24px; overflow: hidden; background: #E7E2D8; display: flex; flex-direction: column;">
        <div style="height: 26px; background: #D9D3C6;"></div>
        <div style="flex-grow: 1; background: #123A7A; display: flex; align-items: center; justify-content: center; padding: 26px;">
          <div style="display: flex; align-items: center; gap: 26px;">
            <svg viewBox="0 0 100 100" width="112" height="112">
              <g stroke="#123A7A" stroke-width="3.5" stroke-linejoin="round">
                <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#4A8BE8"></path>
                <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
                <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path>
                <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
                <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
                <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#9B6BC4"></path>
              </g>
              <circle cx="50" cy="50" r="13.5" fill="#FFFFFF"></circle>
              <circle cx="50" cy="50" r="7" fill="#00A3AD"></circle>
            </svg>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 66px; font-weight: 700; color: #FFFFFF; line-height: 1;">Tindolelê</div>
              <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.3em; color: #FFC220; text-transform: uppercase; text-indent: 0.3em;">Construindo Caminhos</div>
            </div>
          </div>
        </div>
        <div style="height: 118px; background: #EDE8DE; display: flex; align-items: center; gap: 18px; padding: 0 26px;">
          <div style="width: 78px; height: 62px; border-radius: 8px 8px 0 0; background: #F58220;"></div>
          <div style="width: 78px; height: 62px; border-radius: 8px 8px 0 0; background: #3CB44A;"></div>
          <div style="flex-grow: 1;"></div>
          <div style="font-size: 14px; font-weight: 700; color: rgba(18,58,122,0.6);">[ENDEREÇO DA ESCOLA] · [TELEFONE]</div>
        </div>
      </div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Fachada</div>
    </div>

    <div style="grid-column: span 5; display: flex; flex-direction: column; gap: 24px;">

      <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
        <div style="flex-grow: 1; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 24px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="width: 168px; height: 150px; background: #1B57B0; border-radius: 14px 14px 8px 8px; position: relative; display: flex; align-items: center; justify-content: center;">
              <svg viewBox="0 0 100 100" width="54" height="54">
                <g stroke="#1B57B0" stroke-width="4" stroke-linejoin="round">
                  <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#FFFFFF"></path>
                  <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
                  <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path>
                  <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
                  <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
                  <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#9B6BC4"></path>
                </g>
                <circle cx="50" cy="50" r="14" fill="#FFFFFF"></circle>
              </svg>
            </div>
            <span style="font-size: 12px; font-weight: 700; color: rgba(18,58,122,0.6);">Camiseta</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="width: 122px; height: 178px; border-radius: 12px; background: #FBF7F0; border: 2px solid rgba(18,58,122,0.12); display: flex; flex-direction: column; align-items: center; padding: 14px 10px; gap: 8px;">
              <div style="width: 46px; height: 6px; border-radius: 3px; background: rgba(18,58,122,0.25);"></div>
              <svg viewBox="0 0 100 100" width="42" height="42">
                <g stroke="#FBF7F0" stroke-width="4" stroke-linejoin="round">
                  <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#1B57B0"></path>
                  <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
                  <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFC220"></path>
                  <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
                  <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
                  <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path>
                </g>
                <circle cx="50" cy="50" r="15" fill="#FBF7F0"></circle>
              </svg>
              <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 17px; font-weight: 700; color: #123A7A;">Tindolelê</div>
              <div style="width: 100%; height: 1px; background: rgba(18,58,122,0.12);"></div>
              <div style="font-size: 11px; font-weight: 800; color: #123A7A; text-align: center; line-height: 1.3;">[NOME]</div>
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: #F58220; text-transform: uppercase;">Professora</div>
            </div>
            <span style="font-size: 12px; font-weight: 700; color: rgba(18,58,122,0.6);">Crachá</span>
          </div>
        </div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Uniforme e identificação</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="border-radius: 24px; background: #FFC220; padding: 26px 28px; display: flex; align-items: center; gap: 22px;">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <g stroke="#FFC220" stroke-width="4" stroke-linejoin="round">
              <path d="M50 50 L50 2 A48 48 0 0 1 91.57 26 Z" fill="#123A7A"></path>
              <path d="M50 50 L91.57 26 A48 48 0 0 1 91.57 74 Z" fill="#3CB44A"></path>
              <path d="M50 50 L91.57 74 A48 48 0 0 1 50 98 Z" fill="#FFFFFF"></path>
              <path d="M50 50 L50 98 A48 48 0 0 1 8.43 74 Z" fill="#F58220"></path>
              <path d="M50 50 L8.43 74 A48 48 0 0 1 8.43 26 Z" fill="#E8402A"></path>
              <path d="M50 50 L8.43 26 A48 48 0 0 1 50 2 Z" fill="#7C4DA0"></path>
            </g>
            <circle cx="50" cy="50" r="14" fill="#FFC220"></circle>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive; font-size: 30px; font-weight: 700; color: #123A7A; line-height: 1.1;">Matrículas abertas</div>
            <div style="font-size: 13px; font-weight: 700; color: rgba(18,58,122,0.75);">[TURMAS] · [PERÍODO] · [CONTATO]</div>
          </div>
        </div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #123A7A; text-transform: uppercase;">Post / banner</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
